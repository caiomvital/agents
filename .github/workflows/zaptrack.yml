name: zaptrack-rascunho

# Desligado por padrão: só roda manualmente. Para agendar, descomente o bloco `schedule`
# (ex.: todo dia às 10:00 UTC = 07:00 em Brasília) DEPOIS de ter um usuário exclusivo do robô na Liv.
on:
  workflow_dispatch:
    inputs:
      de:
        description: "Data inicial (AAAA-MM-DD). Vazio = última data da planilha ou ontem"
        required: false
      ate:
        description: "Data final (AAAA-MM-DD). Vazio = hoje"
        required: false
  # schedule:
  #   - cron: "0 10 * * *"

jobs:
  rascunho:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liv-zaptrack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Gerar rascunho (somente leitura na Liv)
        env:
          LIV_LOGIN: ${{ secrets.LIV_LOGIN }}
          LIV_SENHA: ${{ secrets.LIV_SENHA }}
          LIV_ALLOW_SESSION_TAKEOVER: "0"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAPTRACK_CONFIG_JSON: ${{ secrets.ZAPTRACK_CONFIG_JSON }}
        run: |
          # config.json tem telefones da equipe e não vai para o repositório: guarde o conteúdo no segredo
          # ZAPTRACK_CONFIG_JSON. Sem o segredo, usa o exemplo (sem lista de telefones internos).
          if [ -n "$ZAPTRACK_CONFIG_JSON" ]; then printf '%s' "$ZAPTRACK_CONFIG_JSON" > config.json; else cp config.example.json config.json; fi
          ARGS=""
          [ -n "${{ inputs.de }}" ] && ARGS="$ARGS --de ${{ inputs.de }}"
          [ -n "${{ inputs.ate }}" ] && ARGS="$ARGS --ate ${{ inputs.ate }}"
          node src/cli.js $ARGS --saida out/rascunho.csv
      - uses: actions/upload-artifact@v4
        with:
          name: rascunho-zaptrack
          path: liv-zaptrack/out/rascunho.csv
          retention-days: 7   # o CSV tem nomes e telefones de leads: não guardar por muito tempo
